<xs-dialog
  [header]="dialogModel.header!"
  okButtonLabel="Guardar"
  [showOkButton]="dialogModel.showOkButton!"
  size="md"
  [display]="dialogModel.display!"
  (onAceptar)="onAceptarDialog()"
  (onCerrar)="cerrarDialog()">

  <ng-template #content>
    <form [formGroup]="formConfig.formulario"
          (ngSubmit)="formSubmitEvent()"
          class="flex flex-col gap-4 w-full my-2">

      <!-- =====================
           DATOS PRINCIPALES
      ====================== -->
      <div class="flex flex-col md:flex-row gap-4">

        <div class="flex-1">
          <xs-input-text
            placeholder="Código"
            [maxLength]="50"
            [control]="$any(formConfig.code)"
            class="w-full">
          </xs-input-text>
        </div>

        <div class="flex-1">
          <xs-input-text
            placeholder="Nombre"
            [maxLength]="255"
            [control]="$any(formConfig.name)"
            class="w-full">
          </xs-input-text>
        </div>

      </div>

      <div class="flex flex-col md:flex-row gap-4">
        <div class="flex-1">
          <xs-select
            [control]="$any(formConfig.categoryId)"
            [dataSource]="categories"
            optionLabel="name"
            optionValue="parameterId"
            placeholder="Categoría">
          </xs-select>
        </div>

        <div class="flex-1">
          <xs-select
            [control]="$any(formConfig.unitMeasureId)"
            [dataSource]="unitMeasures"
            optionLabel="name"
            optionValue="parameterId"
            placeholder="Unidad de Medida">
          </xs-select>
        </div>
      </div>

      <div class="flex flex-col md:flex-row gap-4">
        <div class="flex-1">
          <xs-select
            [control]="$any(formConfig.valuationMethodId)"
            [dataSource]="valuationMethods"
            optionLabel="name"
            optionValue="parameterId"
            placeholder="Metodo de valuación">
          </xs-select>
        </div>

        <div class="flex-1">
          <xs-input-number
            placeholder="Precio Base"
            [control]="$any(formConfig.basePrice)">
          </xs-input-number>
        </div>
      </div>

      <div class="flex flex-col md:flex-row gap-4">
        <div class="flex-1">
          <xs-input-number
            placeholder="Precio Promocional"
            [control]="$any(formConfig.promoPrice)">
          </xs-input-number>
        </div>

        <div class="flex-1">
          <xs-input-number
            placeholder="Costo Base"
            [control]="$any(formConfig.baseCost)">
          </xs-input-number>
        </div>
      </div>

      <xs-editor
        placeholder="Descripción"
        [maxLength]="500"
        [control]="$any(formConfig.description)"
        class="w-full">
      </xs-editor>

      <xs-upload></xs-upload>
    </form>
  </ng-template>
</xs-dialog>

<xs-toast #xsToastRegister position="top-center"></xs-toast>
