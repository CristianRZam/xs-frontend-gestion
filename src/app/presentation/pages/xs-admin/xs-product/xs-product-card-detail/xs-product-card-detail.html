<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
  <xs-card-detail
    titulo="Productos Totales"
    [cantidad]="totalProducts"
    icono="fa-solid fa-boxes-stacked"
    color="#3B82F6"> <!-- Azul -->
  </xs-card-detail>

  <xs-card-detail
    titulo="Productos Activos"
    [cantidad]="activeProducts"
    icono="fa-solid fa-box-open"
    color="#10B981"> <!-- Verde -->
  </xs-card-detail>

  <xs-card-detail
    titulo="Productos Inactivos"
    [cantidad]="inactiveProducts"
    icono="fa-solid fa-box-archive"
    color="#EF4444"> <!-- Rojo -->
  </xs-card-detail>

  <xs-card-detail
    titulo="Stock Total"
    [cantidad]="totalStock"
    icono="fa-solid fa-warehouse"
    color="#F59E0B"> <!-- Amarillo -->
  </xs-card-detail>
</div>
