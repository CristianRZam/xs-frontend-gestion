<div class="my-4">
  <xs-table [columns]="columns" [dataSource]="products" title="Lista de productos" [addButtonShow]="canCreate" [editButtonShow]="canEdit"
            [exportExcelButtonShow]="canExport" [deleteButtonShow]="canDelete"
            [exportPdfButtonShow]="canExport" [statusToggleButtonActive]="canEdit" (onUpdateActiveItem)="onUpdateActiveItem($event)"
            (addItem)="onAddItem()" (updateItem)="onUpdateItem($event)" (deleteItem)="onDeleteItem($event)" [totalRecords]="totalRecords"
            (exportPdf)="onExportPdf($event)" (exportExcel)="onExportExcel($event)">
    <ng-template #additionalOutLeftButtons>
      <xs-button
        label="Catálogo"
        icon="fa-solid fa-book-open"
        severity="warn"
        [rounded]="false"
        [variant]="'outlined'"
        (click)="onClickCatalogo()"
        [fullWidth]="true"
        class="w-full sm:w-auto">
      </xs-button>
    </ng-template>
    <ng-template #additionalTableButtons let-item="item">
      <xs-button icon="fa-solid fa-clock-rotate-left" severity="secondary" variant="outlined" [rounded]="false" (click)="onMovements(item)"></xs-button>
    </ng-template>
  </xs-table>
</div>
