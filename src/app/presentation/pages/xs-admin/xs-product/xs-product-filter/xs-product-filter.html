<div class="mt-4">
  <xs-fieldset legend="Criterios de búsqueda">
    <ng-template #content>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

        <div>
          <xs-input-text
            placeholder="Código"
            [control]="$any(code)">
          </xs-input-text>
        </div>

        <div>
          <xs-input-text
            placeholder="Nombre"
            [control]="$any(name)">
          </xs-input-text>
        </div>

        <div>
          <xs-input-text
            placeholder="Descripción"
            [control]="$any(description)">
          </xs-input-text>
        </div>

        <div>
          <xs-multiselect
            placeholder="Categoria"
            [dataSource]="categoriesData"
            optionValue="parameterId"
            optionLabel="name"
            [control]="$any(categories)"
            [maxSelectedLabels]="4">
          </xs-multiselect>
        </div>

        <div>
          <xs-multiselect
            placeholder="Unidad de medida"
            [dataSource]="unitMeasuresData"
            optionValue="parameterId"
            optionLabel="name"
            [control]="$any(unitMeasures)"
            [maxSelectedLabels]="4">
          </xs-multiselect>
        </div>

        <div>
          <xs-select
            placeholder="Variante"
            [control]="$any(manageVariant)"
            [dataSource]="manageVariantsOptions"
            optionLabel="label"
            optionValue="value"
            [showClear]="true">
          </xs-select>
        </div>

        <div>
          <xs-input-number
            placeholder="Stock Mínimo"
            [control]="$any(minimumStock)">
          </xs-input-number>
        </div>

        <div>
          <xs-input-number
            placeholder="Stock Máximo"
            [control]="$any(maximumStock)">
          </xs-input-number>
        </div>


        <div>
          <xs-select
            placeholder="Estado"
            [control]="$any(status)"
            [dataSource]="statusOptions"
            optionLabel="label"
            optionValue="value"
            [showClear]="true">
          </xs-select>
        </div>

        <div>
          <xs-multiselect
            placeholder="Metodo de valuación"
            [control]="$any(valuationMethods)"
            [dataSource]="valuationMethodsData"
            optionValue="parameterId"
            optionLabel="name"
            [showClear]="true"
            [maxSelectedLabels]="4">
          </xs-multiselect>
        </div>

      </div>

      <!-- Botones -->
      <div class="mt-4 flex justify-center gap-2">
        <xs-filter-buttons
          (clear)="onClickClear()"
          (filter)="onClickFilter()">
        </xs-filter-buttons>
      </div>
    </ng-template>
  </xs-fieldset>
</div>
