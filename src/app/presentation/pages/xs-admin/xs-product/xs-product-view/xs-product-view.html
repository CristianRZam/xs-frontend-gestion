<xs-page-header title="Gestion de Productos" description="Gestiona a todos tus productos aquí"></xs-page-header>

<xs-product-card-detail [totalProducts]="totalProducts" [activeProducts]="activeProducts" [inactiveProducts]="inactiveProducts" [totalStock]="totalStock"></xs-product-card-detail>

<xs-product-filter (filter)="updateFilter($event)" [categoriesData]="categories" [unitMeasuresData]="unitMeasures" [valuationMethodsData]="valuationMethods"></xs-product-filter>

<xs-product-table [products]="products" (addItem)="onAddItem()" (updateItem)="onUpdateItem($event)" (deleteItem)="onDeleteItem($event)" (updateActiveItem)="onUpdateActiveItem($event)"
                  (exportPdf)="exportPdf($event)" (exportExcel)="exportExcel($event)" [totalRecords]="totalProducts"
                  (catalog)="onCatalog()" (movements)="onMovements($event)"></xs-product-table>

<xs-product-register (onCreate)="create($event)" (onUpdate)="update($event)"></xs-product-register>

<xs-product-catalog-dialog [configurations]="catalogConfigurations" (onSave)="saveCatalogConfiguration($event)"></xs-product-catalog-dialog>

<xs-inventory-movement-history [visible]="movementHistoryVisible" [productId]="movementProduct?.id" [productName]="movementProduct?.name || ''" (closed)="onMovementHistoryClose()"></xs-inventory-movement-history>

<xs-loader #xsLoader></xs-loader>

<xs-toast #xsToastProductView position="top-center"></xs-toast>
